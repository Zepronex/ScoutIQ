name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - v2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  SCOUTIQ_AGENT_ENABLED: "false"

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.18.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Build API and web
        run: pnpm run build

      - name: Check the web bundle for server secrets
        run: pnpm run security:frontend

      - name: Run API tests
        run: pnpm run test:api

      - name: Run smoke helper tests
        run: pnpm run test:smoke

      - name: Run pipeline tests
        run: pnpm run pipeline:test

      - name: Run model tests
        run: pnpm run model:test

      - name: Run PySpark transformation tests
        run: pnpm run databricks:test

      - name: Run public snapshot packaging tests
        run: pnpm run databricks:snapshot:test

      - name: Run resume metrics tests
        run: pnpm run resume:metrics:test

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scoutiq
          POSTGRES_USER: scoutiq
          POSTGRES_PASSWORD: scoutiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoutiq -d scoutiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://scoutiq:scoutiq@localhost:5432/scoutiq
      SCOUTIQ_BROWSER_FIXTURE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.18.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Load the synthetic gameweek
        run: |
          pnpm run db:migrate
          node scripts/prepare-browser-fixture.mjs "$RUNNER_TEMP/fixture"
          pnpm run refresh:fpl --snapshot "$RUNNER_TEMP/fixture"

      - name: Build and start the production server
        run: |
          pnpm run build
          NODE_ENV=production SCOUTIQ_DATA_MODE=sample PORT=3001 FRONTEND_URL=http://localhost:3001 \
            node apps/api/dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:3001/api/health > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Run browser journeys
        run: pnpm run test:browser
        env:
          SCOUTIQ_WEB_URL: http://localhost:3001

      - name: Run database planning tests
        run: pnpm run test:planning-db

      - name: Run the release smoke check
        run: pnpm run smoke:app
        env:
          SCOUTIQ_API_URL: http://localhost:3001
          SCOUTIQ_WEB_URL: http://localhost:3001

      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build -t scoutiq:ci .
